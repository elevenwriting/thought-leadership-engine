[project]
name = "thought-leadership-engine"
version = "0.1.0"
description = "Capture your company's thought leadership, tag it with AI, and query it from Claude, ChatGPT or any MCP client."
readme = "README.md"
license = { text = "CPAL-1.0" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "httpx>=0.27",
  "certifi",
  "anthropic>=2.6",
  "openai>=1.50",
  "google-genai>=1.0",
  "google-api-python-client>=2.140",
  "google-auth>=2.30",
  "psycopg[binary]>=3.2",
  "pypdf>=4.3",
  "pypdfium2>=4.30",
  "pillow>=10.0",
  "python-docx>=1.1",
  "slack_sdk>=3.31",
  "mcp>=2.3,<3",
  "trafilatura>=2.0",
  "playwright>=1.48",
  "jinja2>=3.1",
  "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6.0"]

[project.scripts]
tle = "tle.cli:main"
tle-mcp = "tle.mcp_server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tle*"]

[tool.setuptools.package-data]
tle = ["static/*", "schema/*.sql", "templates/dashboard/*.html", "playbooks.md"]
